name: Bug
description: Reporta un defecto.
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options:
        - Crítica
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      placeholder: producción / local, versión, tenant
